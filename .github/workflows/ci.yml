name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: espacofit
          POSTGRES_PASSWORD: espacofit
          POSTGRES_DB: espacofit
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U espacofit" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://espacofit:espacofit@localhost:5432/espacofit
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-nao-usar-em-producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # scripts leem ../../.env; variáveis do job acima têm precedência sobre o arquivo
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm run typecheck
      # MinIO não cabe em `services` (exige o comando `server`); mesmo usuário e bucket do docker-compose
      - run: |
          docker run -d -p 9000:9000 -e MINIO_ROOT_USER=espacofit -e MINIO_ROOT_PASSWORD=espacofit123 minio/minio server /data
          docker run --rm --network host --entrypoint sh minio/mc -c "until mc alias set local http://localhost:9000 espacofit espacofit123; do sleep 1; done; mc mb -p local/media"
      - run: npm -w apps/api run prisma:deploy
      - run: npm -w apps/api test
