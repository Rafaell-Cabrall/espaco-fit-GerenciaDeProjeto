services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: espacofit
      POSTGRES_PASSWORD: espacofit
      POSTGRES_DB: espacofit
    ports: ['5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U espacofit']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6380:6379']

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: espacofit
      MINIO_ROOT_PASSWORD: espacofit123
    # 9100/9101 no host: o Hyper-V do Windows reserva faixas que às vezes cobrem 9000 e 9001
    ports: ['9100:9000', '9101:9001']
    volumes: ['miniodata:/data']

  # cria o bucket "media" uma vez e sai
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 espacofit espacofit123; do sleep 1; done;
      mc mb -p local/media;
      mc anonymous set download local/media;
      "

volumes:
  pgdata:
  miniodata: